[project]
name = "regex-learning-library"
version = "0.1.0"
description = "A runnable learning library about regular expressions — backreferences, forward references, lookaround and what they cost — one question per page, answered in Rust, Python, ABAP, Perl, JavaScript, Ruby, Java, Go, grep and sed, published as a searchable site."
requires-python = ">=3.11"
dependencies = []

# Not an installable package — just a place to pin the docs toolchain so CI and
# the local preview resolve the exact same versions from uv.lock.
[tool.uv]
package = false

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-same-dir==0.1.3",
]
